[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kakao-summary-mcp"
version = "0.1.0"
description = "MCP server that crawls, summarizes, and semantically searches KakaoTalk OpenChat rooms on Windows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "989-alt" }]
keywords = ["mcp", "kakaotalk", "openchat", "summarization", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.0.0",
    "pyautogui>=0.9.54",
    "pywinauto>=0.6.8 ; sys_platform == 'win32'",
    "pyperclip>=1.8.2",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0.1",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "pydantic>=2.0.0",
    "pywin32>=306 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# 진짜 백그라운드 OCR 추출(method="ocr") 경로용.
# 1순위: Windows 내장 OCR(winrt, 한국어 정확·고속, 모델 다운로드 없음, OCR 언어팩 필요)
# 폴백: easyocr(언어팩 없을 때)
ocr = [
    "winrt-Windows.Media.Ocr ; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging ; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams ; sys_platform == 'win32'",
    "winrt-Windows.Globalization ; sys_platform == 'win32'",
    "winrt-Windows.Foundation ; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections ; sys_platform == 'win32'",
    "easyocr>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/989-alt/kakao-summary-mcp"
Issues = "https://github.com/989-alt/kakao-summary-mcp/issues"

[project.scripts]
kakao-summary-mcp = "kakao_summary_mcp.server:main"
kakao-summary-mcp-probe = "kakao_summary_mcp.probe:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.hatch.build.targets.wheel]
packages = ["src/kakao_summary_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/", "skill/", "README.md", "LICENSE", "pyproject.toml"]
